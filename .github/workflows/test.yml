name: Test

on:
  pull_request:
  push:
    branches: [security/next-oct-2026]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm test
